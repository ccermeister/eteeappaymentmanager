<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETEEAP Ledger — Collections Record</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login-screen" class="login-screen">
  <div class="login-visual" aria-hidden="true">
    <div class="login-visual-copy">
      <p class="login-visual-kicker">ETEEAP Batch 2026-2027</p>
      <p class="login-visual-title">Student collections<br>made clear.</p>
      <p class="login-visual-caption">An initiative made possible by the ETEEAP Officers.</p>
    </div>
    <div class="login-visual-image"></div>
  </div>
  <div class="login-card">
    <header class="login-heading">
      <p class="login-eyebrow">ETEEAP OFFICERS</p>
      <h1 class="login-title">Student collections</h1>
      <p class="login-sub">Sign in to manage the ETEEAP Batch 2026-2027 payment register.</p>
    </header>
    <form id="login-form" autocomplete="off">
      <label class="field">
        <span>Account name</span>
        <input type="text" id="login-username" required autocomplete="username">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="login-password" required autocomplete="current-password">
      </label>
      <p id="login-error" class="login-error" hidden>Username or password not recognized.</p>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <footer class="login-foot">Authorized school staff only</footer>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
