<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETEEAP Ledger — Dashboard</title>
<link rel="icon" type="image/png" href="public/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="global-topbar">
  <div class="global-brand"><span class="global-brand-mark">ETEEAP</span><span class="global-brand-name">Student collections</span></div>
  <div class="global-context">Internal school finance record</div>
</header>
<div id="app-shell" class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <p class="brand-mark">ETEEAP</p>
      <p class="brand-sub">Ledger</p>
    </div>
    <nav id="sidebar-nav" class="sidebar-nav"></nav>
    <div class="sidebar-account-action">
      <button id="account-settings-action" class="btn btn-ghost btn-block" data-open-modal="user-settings">Account settings</button>
    </div>
    <div class="sidebar-bottom">
      <div class="account-summary">
        <span id="whoami-avatar" class="account-avatar" aria-hidden="true"></span>
        <div class="whoami">
          <span id="whoami-name" class="whoami-name"></span>
          <span id="whoami-role" class="whoami-role"></span>
        </div>
      </div>
      <button id="logout-btn" class="btn btn-ghost btn-block">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="view-title">Dashboard</h2>
      <div id="topbar-actions" class="topbar-actions"></div>
    </header>
    <div id="view-root" class="view-root"></div>
  </main>
</div>
<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
